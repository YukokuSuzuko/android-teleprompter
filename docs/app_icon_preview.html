<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-2 space-y-3">
    <!-- Top compact control bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)] text-xs">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="text-[var(--muted-foreground)] font-medium">图标形态：</span>
        <button data-mode="squircle" class="mode-btn px-2.5 py-1 rounded-full border border-[var(--card-border)] cursor-pointer font-medium transition-colors">圆角方（默认）</button>
        <button data-mode="circle" class="mode-btn px-2.5 py-1 rounded-full border border-[var(--card-border)] cursor-pointer font-medium transition-colors">圆形（Pixel）</button>
        <button data-mode="monochrome" class="mode-btn px-2.5 py-1 rounded-full border border-[var(--card-border)] cursor-pointer font-medium transition-colors">Android 13+ 莫奈单色</button>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-[var(--muted-foreground)]">壁纸：</span>
        <button data-wall="dark" class="wall-btn px-2 py-1 rounded-lg border border-[var(--card-border)] cursor-pointer">深色</button>
        <button data-wall="light" class="wall-btn px-2 py-1 rounded-lg border border-[var(--card-border)] cursor-pointer">浅色</button>
      </div>
    </div>

    <!-- 4 Icon Concept Cards -->
    <div id="icon-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
  </div>

  <script>
    const CONCEPTS = [
      {
        id: 'A',
        title: '方案 A · 焦点提词行',
        tag: '推荐 · 最搭UI',
        desc: '左侧琥珀金焦点条 + 三行提词进度（暗/亮/白）',
        renderSvg(mono) {
          const bg = mono ? '#383016' : '#16171D';
          const accent = mono ? '#F5D67B' : '#FFE066';
          const dim = mono ? '#8F7B42' : '#4E515E';
          const bright = mono ? '#F5D67B' : '#F4F5F8';
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${bg}"/>
              <!-- Subtle radial glow behind active bar -->
              ${mono ? '' : '<circle cx="54" cy="54" r="38" fill="#FFE066" opacity="0.06"/>'}
              <!-- Left vertical focus bar -->
              <rect x="24" y="34" width="6.5" height="40" rx="3.25" fill="${accent}"/>
              <!-- Line 1 (dimmed past line) -->
              <rect x="38" y="33" width="40" height="7" rx="3.5" fill="${dim}"/>
              <!-- Line 2 (active highlighted line) -->
              <rect x="38" y="49.5" width="46" height="9" rx="4.5" fill="${accent}"/>
              <!-- Line 3 (upcoming bright line) -->
              <rect x="38" y="67.5" width="34" height="7.5" rx="3.75" fill="${bright}"/>
            </svg>`;
        }
      },
      {
        id: 'B',
        title: '方案 B · 声波跟读',
        tag: '强调 AI 语音',
        desc: '左侧声波柱驱动右侧台词流，一眼懂“声随字滚”',
        renderSvg(mono) {
          const bg = mono ? '#383016' : '#14161C';
          const accent = mono ? '#F5D67B' : '#FFE066';
          const sub = mono ? '#C5AD65' : '#E8EAF0';
          const dim = mono ? '#8F7B42' : '#505463';
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${bg}"/>
              <!-- Voice waveform bars -->
              <rect x="23" y="46" width="5.5" height="16" rx="2.75" fill="${accent}" opacity="0.75"/>
              <rect x="32" y="34" width="5.5" height="40" rx="2.75" fill="${accent}"/>
              <rect x="41" y="41" width="5.5" height="26" rx="2.75" fill="${accent}" opacity="0.9"/>
              <!-- Script lines driven by voice -->
              <rect x="54" y="36" width="28" height="6.5" rx="3.25" fill="${dim}"/>
              <rect x="54" y="50" width="32" height="8" rx="4" fill="${accent}"/>
              <rect x="54" y="65" width="24" height="6.5" rx="3.25" fill="${sub}"/>
            </svg>`;
        }
      },
      {
        id: 'C',
        title: '方案 C · 镜头取景框',
        tag: '专业片场感',
        desc: '相机取景四角框 + 高对比中轴提词行',
        renderSvg(mono) {
          const bg = mono ? '#383016' : '#121318';
          const accent = mono ? '#F5D67B' : '#FFE066';
          const frame = mono ? '#C5AD65' : '#8D91A0';
          const white = mono ? '#F5D67B' : '#F4F5F8';
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${bg}"/>
              <!-- Viewfinder corner brackets -->
              <path d="M24 37 V28 A4 4 0 0 1 28 24 H37" fill="none" stroke="${frame}" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M71 24 H80 A4 4 0 0 1 84 28 V37" fill="none" stroke="${frame}" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M24 71 V80 A4 4 0 0 0 28 84 H37" fill="none" stroke="${frame}" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M71 84 H80 A4 4 0 0 0 84 80 V71" fill="none" stroke="${frame}" stroke-width="4.5" stroke-linecap="round"/>
              <!-- Centered script lines -->
              <rect x="35" y="38" width="38" height="6" rx="3" fill="${frame}" opacity="0.65"/>
              <rect x="31" y="50" width="46" height="8.5" rx="4.25" fill="${accent}"/>
              <rect x="38" y="64.5" width="32" height="6" rx="3" fill="${white}"/>
            </svg>`;
        }
      },
      {
        id: 'D',
        title: '方案 D · 几何字母 T',
        tag: 'Google 原生风',
        desc: '极简字母 T（Teleprompter）+ 录音状态圆点',
        renderSvg(mono) {
          const bg = mono ? '#383016' : '#181A22';
          const accent = mono ? '#F5D67B' : '#FFE066';
          const white = mono ? '#F5D67B' : '#F3F4F8';
          const dot = mono ? '#F5D67B' : '#4CD964';
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${bg}"/>
              <!-- Top bar of T (highlighted cue bar) -->
              <rect x="26" y="29" width="56" height="14" rx="7" fill="${accent}"/>
              <!-- Vertical stem of T -->
              <rect x="46.5" y="48" width="15" height="33" rx="7.5" fill="${white}"/>
              <!-- Live listening pulse dot -->
              <circle cx="72" cy="72" r="7.5" fill="${dot}"/>
            </svg>`;
        }
      }
    ];

    let mode = 'squircle';
    let wall = 'dark';

    function render() {
      const grid = document.getElementById('icon-grid');
      const isMono = mode === 'monochrome';
      const radiusClass = mode === 'circle' || isMono ? 'rounded-full' : 'rounded-[22px]';
      const wallBg = wall === 'dark'
        ? 'background: linear-gradient(145deg, #1b1e28, #0f1117); color: #f1f5f9;'
        : 'background: linear-gradient(145deg, #eef2f7, #dbe4f0); color: #1e293b;';

      grid.innerHTML = CONCEPTS.map(c => `
        <div class="rounded-2xl border border-[var(--card-border)] overflow-hidden flex flex-col">
          <!-- Simulated Android Launcher Wallpaper Preview -->
          <div class="py-4 px-3 flex flex-col items-center justify-center gap-2" style="${wallBg}">
            <div class="w-16 h-16 ${radiusClass} overflow-hidden shadow-lg ring-1 ring-black/15 transition-all duration-200">
              ${c.renderSvg(isMono)}
            </div>
            <span class="text-xs font-medium tracking-wide">提词器</span>
          </div>
          <!-- Label -->
          <div class="p-2.5 flex-1 flex flex-col gap-1 border-t border-[var(--card-border)]">
            <div class="flex items-center justify-between gap-1 flex-wrap">
              <span class="text-xs font-bold text-[var(--foreground)]">${c.title}</span>
            </div>
            <span class="text-xs font-medium text-[var(--primary)]">${c.tag}</span>
            <p class="text-xs text-[var(--muted-foreground)] leading-snug">${c.desc}</p>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.mode-btn').forEach(btn => {
        const active = btn.dataset.mode === mode;
        btn.style.background = active ? 'var(--primary)' : 'transparent';
        btn.style.color = active ? 'var(--primary-foreground)' : 'var(--muted-foreground)';
        btn.style.borderColor = active ? 'var(--primary)' : 'var(--card-border)';
      });
      document.querySelectorAll('.wall-btn').forEach(btn => {
        const active = btn.dataset.wall === wall;
        btn.style.background = active ? 'var(--secondary)' : 'transparent';
        btn.style.color = active ? 'var(--secondary-foreground)' : 'var(--muted-foreground)';
      });
    }

    document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; render(); }));
    document.querySelectorAll('.wall-btn').forEach(b => b.addEventListener('click', () => { wall = b.dataset.wall; render(); }));
    render();
  </script>
</body>
</html>
