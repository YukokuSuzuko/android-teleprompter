<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-2 space-y-3">
    <!-- Top compact control bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)] text-xs">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="text-[var(--muted-foreground)] font-medium">MD3 色系：</span>
        <button data-pal="amber" class="pal-btn flex items-center gap-1 px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer"><span class="w-2.5 h-2.5 rounded-full" style="background:#F5B800"></span>暖琥珀</button>
        <button data-pal="blue" class="pal-btn flex items-center gap-1 px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer"><span class="w-2.5 h-2.5 rounded-full" style="background:#1A73E8"></span>谷歌蓝</button>
        <button data-pal="sage" class="pal-btn flex items-center gap-1 px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer"><span class="w-2.5 h-2.5 rounded-full" style="background:#1E8E68"></span>鼠尾草</button>
        <button data-pal="lavender" class="pal-btn flex items-center gap-1 px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer"><span class="w-2.5 h-2.5 rounded-full" style="background:#6750A4"></span>莫奈紫</button>
      </div>
      <div class="flex items-center gap-1.5 flex-wrap">
        <button data-mode="squircle" class="mode-btn px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer">圆角方</button>
        <button data-mode="circle" class="mode-btn px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer">圆形</button>
        <button data-mode="monochrome" class="mode-btn px-2 py-1 rounded-full border border-[var(--card-border)] cursor-pointer">单色主题</button>
      </div>
    </div>

    <!-- 4 Pure MD3 / M3 Expressive Icon Cards -->
    <div id="icon-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
  </div>

  <script>
    const PALETTES = {
      amber: {
        bg: '#FFF2C6',        // primaryContainer (light tonal)
        mid: '#F5C438',       // primary tonal accent
        deep: '#4A3800',      // onPrimaryContainer
        soft: '#FFE082',      // secondary surface
        overlap: '#D99B00',   // intersection tone
        accent: '#E25D33',    // warm tertiary dot
        white: '#FFFDF7',
        monoBg: '#3D3418',
        monoFg: '#F5D67B'
      },
      blue: {
        bg: '#D8E6FF',
        mid: '#4C8DF6',
        deep: '#082E6D',
        soft: '#AECBFA',
        overlap: '#1B66D6',
        accent: '#34A853',
        white: '#F8FBFF',
        monoBg: '#1D3254',
        monoFg: '#B8D0FF'
      },
      sage: {
        bg: '#CEEFE2',
        mid: '#34A87F',
        deep: '#063A28',
        soft: '#95DFC4',
        overlap: '#167C59',
        accent: '#F5B800',
        white: '#F6FCF9',
        monoBg: '#16382C',
        monoFg: '#A5E8CE'
      },
      lavender: {
        bg: '#EDE4FF',
        mid: '#8C6FE0',
        deep: '#2E1569',
        soft: '#D0BCFF',
        overlap: '#6750A4',
        accent: '#E883A8',
        white: '#FBF9FF',
        monoBg: '#342657',
        monoFg: '#DAC9FF'
      }
    };

    const CONCEPTS = [
      {
        id: 'MD3-A',
        title: 'MD3-A · Pixel 柔彩卡片',
        tag: '最接近 Google 原生',
        desc: '浅色 Tonal 底 + 深色极简提词屏，扁平干净、桌面极清晰',
        renderSvg(p, mono) {
          if (mono) {
            return `
              <svg viewBox="0 0 108 108" class="w-full h-full block">
                <rect width="108" height="108" fill="${p.monoBg}"/>
                <rect x="24" y="28" width="60" height="52" rx="16" fill="${p.monoFg}"/>
                <rect x="34" y="40" width="28" height="6.5" rx="3.25" fill="${p.monoBg}" opacity="0.45"/>
                <rect x="34" y="51" width="40" height="7.5" rx="3.75" fill="${p.monoBg}"/>
                <rect x="34" y="63" width="22" height="6.5" rx="3.25" fill="${p.monoBg}" opacity="0.65"/>
              </svg>`;
          }
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${p.bg}"/>
              <!-- Soft secondary tonal backing offset -->
              <rect x="29" y="33" width="56" height="48" rx="15" fill="${p.soft}"/>
              <!-- Main deep tonal teleprompter card -->
              <rect x="23" y="26" width="58" height="49" rx="15" fill="${p.deep}"/>
              <!-- Line 1 dimmed -->
              <rect x="33" y="37" width="26" height="5.5" rx="2.75" fill="${p.soft}" opacity="0.5"/>
              <!-- Line 2 highlighted primary -->
              <rect x="33" y="47.5" width="38" height="7.5" rx="3.75" fill="${p.mid}"/>
              <!-- Line 3 upcoming white -->
              <rect x="33" y="60" width="28" height="5.5" rx="2.75" fill="${p.white}"/>
              <!-- Subtle live mic dot -->
              <circle cx="71" cy="39.5" r="4" fill="${p.accent}"/>
            </svg>`;
        }
      },
      {
        id: 'MD3-B',
        title: 'MD3-B · 波浪花瓣徽章',
        tag: 'M3 Expressive 标志形',
        desc: 'Android 16 标志性圆润波浪形容器 + 镂空高亮台词条',
        renderSvg(p, mono) {
          // 8-lobe soft M3 Expressive Cookie / Scallop path centered at (54,54)
          const scallop = "M54,20 C61,20 64,25 69,27 C74,29 80,27 83,32 C87,37 84,43 86,48 C88,53 91,58 88,64 C85,70 79,71 76,76 C73,81 73,87 67,88 C61,89 58,85 54,85 C50,85 47,89 41,88 C35,87 35,81 32,76 C29,71 23,70 20,64 C17,58 20,53 22,48 C24,43 21,37 25,32 C28,27 34,29 39,27 C44,25 47,20 54,20 Z";
          if (mono) {
            return `
              <svg viewBox="0 0 108 108" class="w-full h-full block">
                <rect width="108" height="108" fill="${p.monoBg}"/>
                <path d="${scallop}" fill="${p.monoFg}"/>
                <rect x="36" y="42" width="36" height="6.5" rx="3.25" fill="${p.monoBg}" opacity="0.5"/>
                <rect x="33" y="52.5" width="42" height="8" rx="4" fill="${p.monoBg}"/>
                <rect x="40" y="64.5" width="28" height="6" rx="3" fill="${p.monoBg}" opacity="0.75"/>
              </svg>`;
          }
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${p.bg}"/>
              <!-- M3 Expressive Soft Scallop Shape -->
              <path d="${scallop}" fill="${p.mid}"/>
              <!-- Crisp 3 cue bars inside -->
              <rect x="37" y="41" width="34" height="6" rx="3" fill="${p.deep}" opacity="0.45"/>
              <rect x="33" y="51.5" width="42" height="8.5" rx="4.25" fill="${p.deep}"/>
              <rect x="39" y="64" width="30" height="6" rx="3" fill="${p.white}"/>
            </svg>`;
        }
      },
      {
        id: 'MD3-C',
        title: 'MD3-C · 叠色几何对话',
        tag: 'Google 双层叠色风',
        desc: '提词页与语音气泡双层几何交叠，极具现代 MD3 辨识度',
        renderSvg(p, mono) {
          if (mono) {
            return `
              <svg viewBox="0 0 108 108" class="w-full h-full block">
                <rect width="108" height="108" fill="${p.monoBg}"/>
                <rect x="22" y="25" width="46" height="44" rx="14" fill="${p.monoFg}" opacity="0.55"/>
                <circle cx="67" cy="65" r="20" fill="${p.monoFg}"/>
                <path d="M62 57 L75 65 L62 73 Z" fill="${p.monoBg}"/>
              </svg>`;
          }
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${p.bg}"/>
              <!-- Back script card -->
              <rect x="21" y="24" width="52" height="48" rx="15" fill="${p.soft}"/>
              <rect x="29" y="34" width="32" height="6" rx="3" fill="${p.deep}" opacity="0.55"/>
              <rect x="29" y="45" width="36" height="6.5" rx="3.25" fill="${p.deep}"/>
              <rect x="29" y="56" width="20" height="6" rx="3" fill="${p.deep}" opacity="0.45"/>
              <!-- Front overlapping voice-play pill -->
              <circle cx="68" cy="66" r="19" fill="${p.mid}" stroke="${p.bg}" stroke-width="3.5"/>
              <!-- Crisp play glyph -->
              <path d="M63.5 58.5 L75.5 66 L63.5 73.5 Z" fill="${p.deep}"/>
            </svg>`;
        }
      },
      {
        id: 'MD3-D',
        title: 'MD3-D · 四叶草提词',
        tag: '圆润亲和 · 极简耐看',
        desc: 'M3 Expressive 四叶草柔和主色底 + 高对比纯白居中台词',
        renderSvg(p, mono) {
          // 4-petal M3 Clover centered at (54,54)
          const clover = "M54,23 C65,23 70,29 70,38 C79,38 85,43 85,54 C85,65 79,70 70,70 C70,79 65,85 54,85 C43,85 38,79 38,70 C29,70 23,65 23,54 C23,43 29,38 38,38 C38,29 43,23 54,23 Z";
          if (mono) {
            return `
              <svg viewBox="0 0 108 108" class="w-full h-full block">
                <rect width="108" height="108" fill="${p.monoBg}"/>
                <path d="${clover}" fill="${p.monoFg}"/>
                <rect x="37" y="44" width="34" height="7" rx="3.5" fill="${p.monoBg}"/>
                <rect x="42" y="56" width="24" height="6.5" rx="3.25" fill="${p.monoBg}" opacity="0.65"/>
              </svg>`;
          }
          return `
            <svg viewBox="0 0 108 108" class="w-full h-full block">
              <rect width="108" height="108" fill="${p.bg}"/>
              <!-- M3 Clover -->
              <path d="${clover}" fill="${p.deep}"/>
              <!-- Center bold bars -->
              <rect x="36" y="42" width="36" height="7.5" rx="3.75" fill="${p.mid}"/>
              <rect x="40" y="54" width="28" height="6.5" rx="3.25" fill="${p.white}"/>
              <circle cx="54" cy="68.5" r="3.5" fill="${p.soft}"/>
            </svg>`;
        }
      }
    ];

    let palKey = 'amber';
    let mode = 'squircle';

    function render() {
      const p = PALETTES[palKey];
      const isMono = mode === 'monochrome';
      const radiusClass = mode === 'circle' || isMono ? 'rounded-full' : 'rounded-[22px]';
      const grid = document.getElementById('icon-grid');

      grid.innerHTML = CONCEPTS.map(c => `
        <div class="rounded-2xl border border-[var(--card-border)] overflow-hidden flex flex-col">
          <div class="py-4 px-3 flex flex-col items-center justify-center gap-2" style="background: linear-gradient(145deg, #1b1e28, #101218); color: #f1f5f9;">
            <div class="w-16 h-16 ${radiusClass} overflow-hidden shadow-lg ring-1 ring-black/15 transition-all duration-200">
              ${c.renderSvg(p, isMono)}
            </div>
            <span class="text-xs font-medium tracking-wide">提词器</span>
          </div>
          <div class="p-2.5 flex-1 flex flex-col gap-1 border-t border-[var(--card-border)]">
            <span class="text-xs font-bold text-[var(--foreground)]">${c.title}</span>
            <span class="text-xs font-medium text-[var(--primary)]">${c.tag}</span>
            <p class="text-xs text-[var(--muted-foreground)] leading-snug">${c.desc}</p>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.pal-btn').forEach(btn => {
        const active = btn.dataset.pal === palKey;
        btn.style.background = active ? 'var(--secondary)' : 'transparent';
        btn.style.borderColor = active ? 'var(--primary)' : 'var(--card-border)';
        btn.style.fontWeight = active ? '600' : '400';
      });
      document.querySelectorAll('.mode-btn').forEach(btn => {
        const active = btn.dataset.mode === mode;
        btn.style.background = active ? 'var(--primary)' : 'transparent';
        btn.style.color = active ? 'var(--primary-foreground)' : 'var(--muted-foreground)';
        btn.style.borderColor = active ? 'var(--primary)' : 'var(--card-border)';
      });
    }

    document.querySelectorAll('.pal-btn').forEach(b => b.addEventListener('click', () => { palKey = b.dataset.pal; render(); }));
    document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; render(); }));
    render();
  </script>
</body>
</html>
