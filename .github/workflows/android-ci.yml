name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # sdkmanager's obsolete 'tools' package no longer exists.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned sherpa-onnx Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            -o app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum -c -

      - name: Compile and run local unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileDebugKotlin

      # CI deliberately does not make an installable APK: the 153 MB speech model
      # is not checked in. Building an APK without it would produce a broken app.
      # Use the separate signed-release workflow for a model-complete APK.
